services:
  # ── Backend — Express API (Web Service) ──────────────────────────────────────
  - type: web
    name: lucid-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install && ./node_modules/.bin/prisma generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_SERVICE_URL
        sync: false

  # ── Agent Service — FastAPI + LangGraph (Web Service) ────────────────────────
  - type: web
    name: lucid-agent-service
    runtime: python
    region: singapore
    plan: starter
    rootDir: agent-service
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
