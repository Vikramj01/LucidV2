[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucid-agent-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langgraph>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "anthropic>=0.40.0",
  "openai>=1.57.0",
  "supabase>=2.10.0",
  "firecrawl-py>=1.5.0",
  "pypdf>=5.1.0",
  "tiktoken>=0.8.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
